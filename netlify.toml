[build]
    command = "npm run build"
    publish = "dist"

[build.environment]
    NODE_VERSION = "20"

# Decap CMS uses hash routing, so /admin/ resolves to a single file.
# This rule guarantees /admin and /admin/anything always serve the
# Decap UI even if Netlify ever expands its path matching rules.
[[redirects]]
    from = "/admin/*"
    to = "/admin/index.html"
    status = 200

# Note: no catch-all /* redirect. Netlify automatically serves
# dist/404.html with a true 404 status code for any path that doesn't
# match a published file. That's what we want for SEO and analytics
# (sending unknown URLs through /index.html as a 200 would dilute both).

# Long-cache hashed assets produced by Vite.
[[headers]]
    for = "/assets/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

# Decap-uploaded media. Filenames aren't hashed, but uploads are
# additive, so a moderate cache is reasonable.
[[headers]]
    for = "/uploads/*"
    [headers.values]
        Cache-Control = "public, max-age=86400"

# Make sure Decap CMS receives config.yml with a Content-Type it likes.
[[headers]]
    for = "/admin/config.yml"
    [headers.values]
        Content-Type = "text/yaml; charset=UTF-8"
        Cache-Control = "no-cache, no-store, must-revalidate"

# Sensible default security headers for a marketing site.
[[headers]]
    for = "/*"
    [headers.values]
        X-Frame-Options = "SAMEORIGIN"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Permissions-Policy = "camera=(), microphone=(), geolocation=()"
